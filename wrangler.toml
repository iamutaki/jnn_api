name = "jnn-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# ─── Vars (local dev) ─────────────────────────────────────────────────
[vars]
API_NAME = "JNN API (Local)"
API_VERSION = "0.0.1"
ENVIRONMENT = "local"
VOUCHER_KEY_VERSION = "1"
FIREBASE_PROJECT_ID = "jnn-mobile-staging"
FIREBASE_CLIENT_EMAIL = "firebase-adminsdk-fbsvc@jnn-mobile-staging.iam.gserviceaccount.com"

# ─── D1 Database (default / local dev) ───────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "jnn-api-db"
database_id = "placeholder-replace-after-create"
migrations_dir = "migrations"

# ─── Staging ──────────────────────────────────────────────────────────
[env.staging]
name = "jnn-api-staging"

[env.staging.vars]
API_NAME = "JNN API (Staging)"
API_VERSION = "0.0.1"
ENVIRONMENT = "staging"
VOUCHER_KEY_VERSION = "1"
FIREBASE_PROJECT_ID = "jnn-mobile-staging"
FIREBASE_CLIENT_EMAIL = "firebase-adminsdk-fbsvc@jnn-mobile-staging.iam.gserviceaccount.com"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "jnn_staging"
database_id = "10fdcdcb-19a9-42fb-9844-2ba5fdc54647"
migrations_dir = "migrations"

# ─── Production ───────────────────────────────────────────────────────
[env.production]
name = "jnn-api"

[env.production.vars]
API_NAME = "JNN API"
API_VERSION = "0.0.1"
ENVIRONMENT = "production"
VOUCHER_KEY_VERSION = "1"
FIREBASE_PROJECT_ID = "jnn-mobile"
FIREBASE_CLIENT_EMAIL = "firebase-adminsdk-fbsvc@jnn-mobile.iam.gserviceaccount.com"

[[env.production.d1_databases]]
binding = "DB"
database_name = "jnn_production"
database_id = "df6885de-0fa1-40c3-8dfe-a144272811f6"
migrations_dir = "migrations"
